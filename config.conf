# Global defaults
DEFAULT_MODE="audit"
HOST_ROLE="server"
VIRTUALIZATION="vmware"
DEFAULT_FILESYSTEM="ext4"

# Paths
SCRIPT_DIR="$(dirname "$(realpath "$0")")"

LOG_FILE="/var/logs/cis-hardening.log"
BACKUP_DIR="$SCRIPT_DIR/backups"

# Optional allowlists/exceptions
# Add items here when you intentionally need them
MODULE_ALLOWLIST=()

# UFW Allowed Ports (Format: "port/protocol" or "port")
# Reference CIS Workbench: HTTP, HTTPS, NTP, DNS, DNS over TLS
UFW_ALLOWLIST=(
    "80/tcp"    # HTTP
    "443/tcp"   # HTTPS
    "123/udp"   # NTP
    "53"        # DNS (TCP/UDP)
    "853/tcp"   # DNS over TLS
    # "3306/tcp"  # MySQL (Uncomment if remote access to custom SQL databases is needed)
)
